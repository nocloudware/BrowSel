name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Test
        run: dotnet test BrowSel.Tests
        if: ${{ hashFiles('BrowSel.Tests/*.csproj') != '' }}
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Tag '${{ github.ref_name }}'
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' (Get-ChildItem dist/BrowSelSetup-*.exe*).FullName --title '${{ github.ref_name }}' --generate-notes
